<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IrAnimeX - Lecteur</title>

    <!-- CSS du lecteur -->
    <link rel="stylesheet" href="joueur-style.css">
    <link rel="stylesheet" href="player-modes.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<header class="player-header">
    <a href="index.html" class="logo">
        <img src="images/logo.png" alt="IrAnimeX">
    </a>

    <a href="index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i>
        <span>Retour</span>
    </a>
</header>

<main class="player-container" id="playerContainer">
    <section class="anime-info">
        <div>
            <h1 id="animeTitle">Chargement...</h1>
            <p id="episodeInfo">Saison 1 • Épisode 1</p>
        </div>
    </section>

    <section class="watch-area">
        <div class="video-column">
            <div class="player-toolbar">
                <label for="displayMode"><i class="fas fa-sliders"></i> Mode d’affichage</label>
                <select id="displayMode" aria-label="Choisir le mode d’affichage du lecteur">
                    <option value="standard">Standard</option>
                    <option value="cinema">Cinéma</option>
                    <option value="fullscreen">Plein écran</option>
                </select>
            </div>

            <div class="video-container" id="videoContainer">
                <video
                    id="videoPlayer"
                    controls
                    playsinline
                    preload="metadata">
                    Votre navigateur ne supporte pas la lecture vidéo.
                </video>

                <div id="videoError" class="video-error">
                    <i class="fas fa-circle-exclamation"></i>
                    <p>Impossible de charger cette vidéo.</p>
                </div>
            </div>

            <div class="episode-controls">
                <button id="previousBtn" class="control-btn">
                    <i class="fas fa-arrow-left"></i>
                    Épisode précédent
                </button>
                <button id="nextBtn" class="control-btn next">
                    Épisode suivant
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <aside class="episodes-panel">
            <div class="episodes-header">
                <h2><i class="fas fa-list"></i> Épisodes</h2>
                <span id="episodeCount">0 épisodes</span>
            </div>
            <div id="episodesList" class="episodes-list">
                <!-- Les épisodes sont ajoutés par joueur-script.js -->
            </div>
        </aside>
    </section>
</main>

<script src="joueur-script.js"></script>
<script src="player-modes.js"></script>
</body>
</html>
