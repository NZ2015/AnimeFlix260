<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails Anime - AnimeFlix260</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
        }

        header {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: 2px solid #ff006e;
            background: transparent;
            color: #ff006e;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #ff006e;
            color: #fff;
            transform: translateY(-2px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .anime-header {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
            margin-bottom: 50px;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .anime-poster {
            width: 100%;
            aspect-ratio: 2/3;
            background: linear-gradient(135deg, #8338ec, #3a86ff);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .anime-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .anime-info {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .anime-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .anime-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .meta-item {
            background: rgba(255, 0, 110, 0.1);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ff006e;
        }

        .meta-label {
            font-size: 12px;
            color: #ff006e;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .meta-value {
            font-size: 16px;
            color: #fff;
        }

        .anime-rating {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stars {
            font-size: 32px;
            color: #ffd700;
        }

        .rating-text {
            font-size: 24px;
            color: #fff;
        }

        .anime-description {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .genres-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .genre-tag {
            background: rgba(255, 0, 110, 0.2);
            color: #ff006e;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid rgba(255, 0, 110, 0.4);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
        }

        .action-btn {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .play-btn {
            background: linear-gradient(135deg, #ff006e, #8338ec);
            color: #fff;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 0, 110, 0.4);
        }

        .favorite-btn {
            background: rgba(255, 0, 110, 0.2);
            color: #ff006e;
            border: 2px solid #ff006e;
        }

        .favorite-btn.active {
            background: #ff006e;
            color: #fff;
        }

        .favorite-btn:hover {
            transform: scale(1.05);
        }

        .episodes-section {
            margin-top: 50px;
        }

        .section-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .episode-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .episode-card:hover {
            border-color: #ff006e;
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 0, 110, 0.2);
        }

        .episode-number {
            font-size: 14px;
            color: #ff006e;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .episode-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }

        .episode-duration {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .episode-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            color: #fff;
            border: none;
            border-radius: 6px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .episode-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 0, 110, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: #16213e;
            margin: 5% auto;
            padding: 0;
            width: 90%;
            max-width: 900px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-video {
            width: 100%;
            background: #000;
        }

        .modal-video video {
            width: 100%;
            display: block;
        }

        .modal-info {
            padding: 30px;
        }

        .close {
            position: absolute;
            right: 30px;
            top: 30px;
            font-size: 40px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.5);
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            z-index: 2001;
        }

        .close:hover {
            background: #ff006e;
            transform: rotate(90deg);
        }

        .modal-content {
            position: relative;
        }

        @media (max-width: 768px) {
            .anime-header {
                grid-template-columns: 1fr;
            }

            .anime-title {
                font-size: 32px;
            }

            .anime-meta {
                grid-template-columns: 1fr;
            }

            .episodes-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo" onclick="window.location.href='index.html'">🎬 AnimeFlix260</div>
            <div class="nav-buttons">
                <a href="index.html" class="btn">Accueil</a>
                <a href="categories.html" class="btn">Catégories</a>
                <a href="favorites.html" class="btn">❤️ Favoris</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div id="animeDetail"></div>
    </div>

    <!-- Modal pour la lecture vidéo -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="modal-video">
                <video id="videoPlayer" controls style="width: 100%; display: block;">
                    <source id="videoSource" src="" type="video/mp4">
                    Votre navigateur ne supporte pas la lecture vidéo HTML5.
                </video>
            </div>
            <div class="modal-info">
                <div style="font-size: 24px; font-weight: bold; margin-bottom: 10px;" id="modalTitle"></div>
                <div style="font-size: 14px; color: rgba(255, 255, 255, 0.6);" id="modalEpisode"></div>
            </div>
        </div>
    </div>

    <script>
        // Récupérer l'ID de l'anime depuis l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const animeId = parseInt(urlParams.get('id'));

        // Charger les données des animes
        fetch('anime.json')
            .then(response => response.json())
            .then(data => {
                const anime = data.animes.find(a => a.id === animeId);
                if (anime) {
                    displayAnimeDetails(anime);
                } else {
                    document.getElementById('animeDetail').innerHTML = '<p>Anime non trouvé</p>';
                }
            });

        function getStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 >= 0.5;
            let stars = '★'.repeat(fullStars);
            if (hasHalfStar) stars += '½';
            return stars;
        }

        function isFavorite(animeId) {
            const favorites = JSON.parse(localStorage.getItem('animeFlix_favorites') || '{}');
            return favorites[animeId] || false;
        }

        function toggleFavorite(animeId) {
            let favorites = JSON.parse(localStorage.getItem('animeFlix_favorites') || '{}');
            favorites[animeId] = !favorites[animeId];
            localStorage.setItem('animeFlix_favorites', JSON.stringify(favorites));
            
            const btn = document.getElementById('favoriteBtn');
            if (favorites[animeId]) {
                btn.classList.add('active');
                btn.textContent = '❤️ Retiré des Favoris';
            } else {
                btn.classList.remove('active');
                btn.textContent = '🤍 Ajouter aux Favoris';
            }
        }

        function playEpisode(episode, animeTitle) {
            const modal = document.getElementById('videoModal');
            document.getElementById('videoSource').src = episode.videoUrl;
            document.getElementById('videoPlayer').load();
            document.getElementById('modalTitle').textContent = animeTitle;
            document.getElementById('modalEpisode').textContent = `Saison 1 - Episode ${episode.number}: ${episode.title}`;
            modal.style.display = 'block';
        }

        document.querySelector('.close').addEventListener('click', function() {
            const modal = document.getElementById('videoModal');
            document.getElementById('videoPlayer').pause();
            modal.style.display = 'none';
        });

        window.addEventListener('click', function(event) {
            const modal = document.getElementById('videoModal');
            if (event.target === modal) {
                document.getElementById('videoPlayer').pause();
                modal.style.display = 'none';
            }
        });

        function displayAnimeDetails(anime) {
            const isFav = isFavorite(anime.id);
            const html = `
                <div class="anime-header">
                    <div class="anime-poster">
                        ${anime.poster ? `<img src="${anime.poster}" alt="${anime.title}">` : `<div>${anime.title}</div>`}
                    </div>
                    <div class="anime-info">
                        <div>
                            <h1 class="anime-title">${anime.title}</h1>
                            
                            <div class="anime-rating">
                                <span class="stars">${getStars(anime.rating)}</span>
                                <span class="rating-text">${anime.rating}/5</span>
                            </div>

                            <div class="anime-meta">
                                <div class="meta-item">
                                    <div class="meta-label">Année</div>
                                    <div class="meta-value">${anime.releaseYear}</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">Studio</div>
                                    <div class="meta-value">${anime.studio}</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">Total d'épisodes</div>
                                    <div class="meta-value">${anime.totalEpisodes}</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">Saison</div>
                                    <div class="meta-value">${anime.seasons[0].title}</div>
                                </div>
                            </div>

                            <div class="anime-description">${anime.description}</div>

                            <div class="genres-list">
                                ${anime.genres.map(genre => `<span class="genre-tag">${genre}</span>`).join('')}
                            </div>
                        </div>

                        <div class="action-buttons">
                            <button class="action-btn play-btn" onclick="playEpisode(${JSON.stringify(anime.seasons[0].episodes[0])}, '${anime.title}')">
                                ▶ Regarder Saison 1 Episode 1
                            </button>
                            <button id="favoriteBtn" class="action-btn favorite-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(${anime.id})">
                                ${isFav ? '❤️ Retiré des Favoris' : '🤍 Ajouter aux Favoris'}
                            </button>
                        </div>
                    </div>
                </div>

                <div class="episodes-section">
                    <h2 class="section-title">Episodes Disponibles</h2>
                    <div class="episodes-grid">
                        ${anime.seasons[0].episodes.map(episode => `
                            <div class="episode-card">
                                <div class="episode-number">Saison 1 - Episode ${episode.number}</div>
                                <div class="episode-title">${episode.title}</div>
                                <div class="episode-duration">⏱️ ${episode.duration}</div>
                                <button class="episode-btn" onclick="playEpisode(${JSON.stringify(episode)}, '${anime.title}')">
                                    ▶ Regarder
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('animeDetail').innerHTML = html;
        }
    </script>
</body>
</html>
