<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catégories - AnimeFlix260</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #0f172a, #111827);
      color: white;
    }
    a { text-decoration: none; color: white; }
    header {
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .header-inner {
      max-width: 1200px; margin: 0 auto; padding: 18px 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo { color: #f472b6; font-weight: 800; font-size: 1.8rem; }
    nav { display: flex; gap: 12px; flex-wrap: wrap; }
    nav a { padding: 10px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); }
    nav a:hover, nav a.active { background: linear-gradient(135deg, #ec4899, #8b5cf6); border-color: transparent; }
    .page { max-width: 1200px; margin: 0 auto; padding: 40px 20px 60px; }
    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 30px;
    }
    .filters input, .filters select, .filters button {
      width: 100%; padding: 12px 14px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.14); background: rgba(15,23,42,0.9); color: white;
    }
    .filters button {
      background: linear-gradient(135deg, #ec4899, #8b5cf6); border: none; font-weight: 700; cursor: pointer;
    }
    .anime-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px;
    }
    .anime-card {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; overflow: hidden;
    }
    .anime-card img { width: 100%; height: 220px; object-fit: cover; }
    .anime-info { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .anime-info h3 { margin: 0; }
    .anime-info p { margin: 0; color: #cbd5e1; }
    .genres { display: flex; flex-wrap: wrap; gap: 8px; }
    .genres span {
      padding: 6px 8px; border-radius: 999px; background: rgba(236,72,153,0.12); color: #f9a8d4; font-size: 0.72rem;
    }
    .primary-btn {
      display: inline-block; text-align: center; background: linear-gradient(135deg, #ec4899, #8b5cf6);
      padding: 10px 16px; border-radius: 10px; font-weight: 700;
    }
    .empty-state { display: none; text-align: center; padding: 20px; color: #cbd5e1; }
    @media (max-width: 780px) { .header-inner { flex-direction: column; } }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">AnimeFlix260</div>
      <nav>
        <a href="index.html">Accueil</a>
        <a class="active" href="categories.html">Catégories</a>
        <a href="favorites.html">Liste</a>
        <a href="account.html">Compte</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <h1>Catégories et filtres avancés</h1>

    <section class="filters">
      <input id="searchInput" type="text" placeholder="Nom, auteur, studio...">
      <select id="genreFilter">
        <option value="Tous">Tous genres</option>
      </select>
      <select id="yearFilter">
        <option value="Tous">Toutes années</option>
      </select>
      <select id="ratingFilter">
        <option value="0">Note minimale : 0</option>
        <option value="4">4+</option>
        <option value="4.5">4.5+</option>
        <option value="4.8">4.8+</option>
      </select>
      <select id="episodesFilter">
        <option value="0">Épisodes : n’importe</option>
        <option value="12">12 épisodes max</option>
        <option value="24">24 épisodes max</option>
        <option value="50">50 épisodes max</option>
      </select>
      <select id="statusFilter">
        <option value="Tous">Tous statuts</option>
        <option value="watchlist">À regarder</option>
        <option value="watching">En cours</option>
        <option value="completed">Terminé</option>
      </select>
      <select id="studioFilter">
        <option value="Tous">Tous studios</option>
      </select>
      <select id="authorFilter">
        <option value="Tous">Tous auteurs</option>
      </select>
      <button id="resetFilters">Réinitialiser</button>
    </section>

    <div id="animeGrid" class="anime-grid"></div>
    <div id="emptyState" class="empty-state">Aucun anime ne correspond à ces filtres.</div>
  </main>

  <script src="app-data.js"></script>
  <script>
    const searchInput = document.getElementById("searchInput");
    const genreFilter = document.getElementById("genreFilter");
    const yearFilter = document.getElementById("yearFilter");
    const ratingFilter = document.getElementById("ratingFilter");
    const episodesFilter = document.getElementById("episodesFilter");
    const statusFilter = document.getElementById("statusFilter");
    const studioFilter = document.getElementById("studioFilter");
    const authorFilter = document.getElementById("authorFilter");
    const resetFilters = document.getElementById("resetFilters");
    const animeGrid = document.getElementById("animeGrid");
    const emptyState = document.getElementById("emptyState");
    let allAnimes = [];

    function renderOptions(select, values) {
      const selected = select.value;
      const unique = ["Tous", ...new Set(values.filter(Boolean))];
      select.innerHTML = unique.map((value) => `
        <option value="${value}">${value === "Tous" ? "Tous" : value}</option>
      `).join("");
      if (unique.includes(selected)) select.value = selected;
      else select.value = "Tous";
    }

    function applyFilters() {
      const query = (searchInput.value || "").trim().toLowerCase();
      const genre = genreFilter.value;
      const year = yearFilter.value;
      const minRating = Number(ratingFilter.value || 0);
      const maxEpisodes = Number(episodesFilter.value || 0);
      const status = statusFilter.value;
      const studio = studioFilter.value;
      const author = authorFilter.value;

      const filtered = allAnimes.filter((anime) => {
        const haystack = [
          anime.title,
          anime.author,
          anime.studio,
          anime.description,
          (anime.genres || []).join(" ")
        ].join(" ").toLowerCase();

        const matchText = !query || haystack.includes(query);
        const matchGenre = genre === "Tous" || (anime.genres || []).includes(genre);
        const matchYear = year === "Tous" || Number(anime.releaseYear) === Number(year);
        const matchRating = Number(anime.rating) >= minRating;
        const matchEpisodes = !maxEpisodes || Number(anime.totalEpisodes) <= maxEpisodes;
        const matchStatus = status === "Tous" || window.AnimeFlix.getWatchlistStatus(anime.id) === status;
        const matchStudio = studio === "Tous" || anime.studio === studio;
        const matchAuthor = author === "Tous" || anime.author === author;

        return matchText && matchGenre && matchYear && matchRating && matchEpisodes && matchStatus && matchStudio && matchAuthor;
      });

      animeGrid.innerHTML = filtered.map((anime) => `
        <article class="anime-card">
          <img src="${anime.poster}" alt="${anime.title}">
          <div class="anime-info">
            <h3>${anime.title}</h3>
            <p>⭐ ${anime.rating}/5 • ${anime.releaseYear}</p>
            <div class="genres">
              ${(anime.genres || []).slice(0, 3).map((genre) => `<span>${genre}</span>`).join("")}
            </div>
            <p>${anime.description}</p>
            <a class="primary-btn" href="details.html?id=${anime.id}">Voir détails</a>
          </div>
        </article>
      `).join("");

      emptyState.style.display = filtered.length ? "none" : "block";
    }

    async function initFilters() {
      allAnimes = await window.AnimeFlix.loadAnimeCatalog();

      const years = [...new Set(allAnimes.map((anime) => String(anime.releaseYear)))].sort((a, b) => Number(b) - Number(a));
      const studios = [...new Set(allAnimes.map((anime) => anime.studio))].sort();
      const authors = [...new Set(allAnimes.map((anime) => anime.author))].sort();
      const genres = [...new Set(allAnimes.flatMap((anime) => anime.genres || []))].sort();

      renderOptions(genreFilter, genres);
      renderOptions(yearFilter, years);
      renderOptions(studioFilter, studios);
      renderOptions(authorFilter, authors);

      [searchInput, genreFilter, yearFilter, ratingFilter, episodesFilter, statusFilter, studioFilter, authorFilter].forEach((el) => {
        el.addEventListener("input", applyFilters);
        el.addEventListener("change", applyFilters);
      });

      resetFilters.addEventListener("click", () => {
        searchInput.value = "";
        genreFilter.value = "Tous";
        yearFilter.value = "Tous";
        ratingFilter.value = "0";
        episodesFilter.value = "0";
        statusFilter.value = "Tous";
        studioFilter.value = "Tous";
        authorFilter.value = "Tous";
        applyFilters();
      });

      applyFilters();
    }

    initFilters();
  </script>
</body>
</html>
