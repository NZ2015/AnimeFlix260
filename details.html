<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails Anime - AnimeFlix260</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
        }
        header {
            background: rgba(0,0,0,0.8);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }
        .nav-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border: 2px solid #ff006e;
            background: transparent;
            color: #ff006e;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .anime-header {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 30px;
        }
        .anime-poster {
            width: 100%;
            aspect-ratio: 2/3;
            border-radius: 10px;
            overflow: hidden;
            background: linear-gradient(135deg, #8338ec, #3a86ff);
        }
        .anime-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .anime-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .anime-meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .meta-item {
            background: rgba(255, 0, 110, 0.1);
            border-left: 4px solid #ff006e;
            border-radius: 8px;
            padding: 15px;
        }
        .meta-label {
            font-size: 12px;
            color: #ff006e;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .meta-value {
            font-size: 16px;
            color: #fff;
        }
        .anime-rating {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .stars { font-size: 32px; color: #ffd700; }
        .rating-text { font-size: 24px; }
        .anime-description {
            font-size: 16px;
            line-height: 1.8;
            color: rgba(255,255,255,0.75);
            margin-bottom: 20px;
        }
        .genres-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .genre-tag {
            background: rgba(255,0,110,0.2);
            color: #ff006e;
            border: 1px solid rgba(255,0,110,0.4);
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 14px;
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .action-btn {
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .primary-btn {
            background: linear-gradient(135deg, #ff006e, #8338ec);
            color: #fff;
        }
        .secondary-btn {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }
        @media (max-width: 768px) {
            .anime-header { grid-template-columns: 1fr; }
            .anime-title { font-size: 32px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo" onclick="window.location.href='index.html'">🎬 AnimeFlix260</div>
            <div class="nav-buttons">
                <a href="index.html" class="btn">Accueil</a>
                <a href="categories.html" class="btn">Catégories</a>
                <a href="favorites.html" class="btn">❤️ Favoris</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div id="animeDetails"></div>
    </div>

    <script>
        const STORAGE_KEY = 'animeFlix_favorites';

        function getFavorites() {
            try {
                const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                return Array.isArray(raw) ? raw : [];
            } catch {
                return [];
            }
        }

        function saveFavorites(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }

        function isFavorite(id) {
            return getFavorites().includes(Number(id));
        }

        function toggleFavorite(id) {
            const favorites = getFavorites();
            const numberId = Number(id);
            const next = favorites.includes(numberId)
                ? favorites.filter(item => item !== numberId)
                : [...favorites, numberId];
            saveFavorites(next);
            render();
        }

        function getAnimeIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return Number(params.get('id'));
        }

        function getAnimeAvgDuration(anime) {
            const values = (anime.seasons || []).flatMap(season => (season.episodes || []).map(ep => {
                const text = String(ep.duration || '').trim();
                if (!text) return 0;
                if (text.includes('h')) {
                    const hours = parseFloat(text.split('h')[0]) || 0;
                    const mins = parseInt((text.split('h')[1] || '').replace(/min|m/gi, '').trim() || '0', 10);
                    return (hours * 60) + mins;
                }
                const parts = text.split(':').map(v => parseInt(v, 10));
                if (parts.length === 2) return (parts[0] * 60) + parts[1];
                return 0;
            }));
            if (!values.length) return 0;
            return values.reduce((sum, value) => sum + value, 0) / values.length;
        }

        function formatDurationLabel(minutes) {
            if (!minutes) return 'Durée inconnue';
            const hours = Math.floor(minutes / 60);
            const mins = Math.round(minutes % 60);
            if (hours === 0) return `${mins} min`;
            if (mins === 0) return `${hours}h`;
            return `${hours}h ${mins}min`;
        }

        function render() {
            const id = getAnimeIdFromUrl();
            const container = document.getElementById('animeDetails');
            if (!container) return;

            fetch('anime.json')
                .then(res => res.json())
                .then(data => {
                    const anime = (data.animes || []).find(item => Number(item.id) === Number(id));
                    if (!anime) {
                        container.innerHTML = '<h2>Anime introuvable.</h2>';
                        return;
                    }

                    const totalEpisodes = (anime.seasons || []).reduce((sum, season) => sum + (season.episodes || []).length, 0);
                    const avgDuration = getAnimeAvgDuration(anime);

                    container.innerHTML = `
                        <div class="anime-header">
                            <div class="anime-poster">
                                <img src="${anime.poster}" alt="${anime.title}">
                            </div>
                            <div class="anime-info">
                                <h1 class="anime-title">${anime.title}</h1>
                                <div class="anime-meta">
                                    <div class="meta-item">
                                        <div class="meta-label">Année</div>
                                        <div class="meta-value">${anime.releaseYear || 'Inconnue'}</div>
                                    </div>
                                    <div class="meta-item">
                                        <div class="meta-label">Studio</div>
                                        <div class="meta-value">${anime.studio || 'Inconnu'}</div>
                                    </div>
                                    <div class="meta-item">
                                        <div class="meta-label">Épisodes</div>
                                        <div class="meta-value">${totalEpisodes}</div>
                                    </div>
                                    <div class="meta-item">
                                        <div class="meta-label">Durée moyenne</div>
                                        <div class="meta-value">${formatDurationLabel(avgDuration)}</div>
                                    </div>
                                </div>
                                <div class="anime-rating">
                                    <span class="stars">★</span>
                                    <span class="rating-text">${anime.rating || 0}/5</span>
                                </div>
                                <div class="genres-list">
                                    ${(anime.genres || []).map(g => `<span class="genre-tag">${g}</span>`).join('')}
                                </div>
                                <div class="anime-description">${anime.description}</div>
                                <div class="action-buttons">
                                    <button class="action-btn primary-btn" onclick="window.location.href='joueur.html?id=${anime.id}'">▶ Regarder</button>
                                    <button class="action-btn secondary-btn" onclick="toggleFavorite(${anime.id})">${isFavorite(anime.id) ? '❤️ Retirer des favoris' : '🤍 Ajouter aux favoris'}</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
        }

        render();
    </script>
</body>
</html>
