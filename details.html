<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Favoris - AnimeFlix260</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
    }
    header {
      background: rgba(0,0,0,0.8);
      padding: 20px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }
    .logo {
      font-size: 28px;
      font-weight: bold;
      background: linear-gradient(135deg, #ff006e, #8338ec);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
    }
    .nav-buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 20px;
      border: 2px solid #ff006e;
      background: transparent;
      color: #ff006e;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .page-title {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #ff006e, #8338ec);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .favorites-count {
      color: rgba(255,255,255,0.75);
      font-size: 18px;
      margin-bottom: 20px;
    }
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 30px;
    }
    .duration-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .duration-btn {
      padding: 10px 18px;
      border-radius: 999px;
      border: 2px solid rgba(255,0,110,0.4);
      background: rgba(255, 0, 110, 0.15);
      color: #ff006e;
      font-weight: 700;
      cursor: pointer;
    }
    .duration-btn.active, .duration-btn:hover {
      background: linear-gradient(135deg, #ff006e, #8338ec);
      color: #fff;
      border-color: transparent;
    }
    .sort-box {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }
    .sort-box select {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .animes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
    }
    .anime-card {
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 15px;
      overflow: hidden;
    }
    .anime-poster img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    .anime-info {
      padding: 20px;
    }
    .anime-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .anime-duration {
      display: inline-block;
      margin-bottom: 10px;
      background: rgba(131, 56, 236, 0.25);
      color: #d9c8ff;
      border: 1px solid rgba(131,56,236,0.5);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .anime-rating {
      margin-bottom: 10px;
      color: #ffd700;
      font-weight: 700;
    }
    .anime-genres {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 12px;
    }
    .genre-tag {
      background: rgba(255,0,110,0.2);
      color: #ff006e;
      border: 1px solid rgba(255,0,110,0.3);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
    }
    .anime-description {
      margin-bottom: 14px;
      color: rgba(255,255,255,0.75);
      line-height: 1.5;
    }
    .card-buttons {
      display: flex;
      gap: 10px;
    }
    .play-btn {
      flex: 1;
      display: inline-block;
      text-align: center;
      text-decoration: none;
      padding: 12px 14px;
      background: linear-gradient(135deg, #ff006e, #8338ec);
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
    }
    .favorite-btn {
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #fff;
      border-radius: 8px;
      padding: 12px 14px;
      cursor: pointer;
    }
    .empty-message {
      text-align: center;
      padding: 30px;
      color: rgba(255,255,255,0.7);
      font-size: 18px;
    }
    @media (max-width: 768px) {
      .page-title { font-size: 32px; }
      .filter-bar { align-items: flex-start; }
    }
  </style>
</head>
<body data-page="favorites">
  <header>
    <div class="header-content">
      <div class="logo" onclick="window.location.href='index.html'">🎬 AnimeFlix260</div>
      <div class="nav-buttons">
        <a href="index.html" class="btn">Accueil</a>
        <a href="categories.html" class="btn">Catégories</a>
        <a href="favorites.html" class="btn">❤️ Favoris</a>
      </div>
    </div>
  </header>

  <div class="container">
    <h1 class="page-title">💙 Mes Favoris</h1>
    <div class="favorites-count" id="favoritesCount">0 anime(s) en favori</div>

    <div class="filter-bar">
      <div class="duration-filters" id="durationFilters"></div>
      <div class="sort-box">
        <label for="sortSelect">Trier :</label>
        <select id="sortSelect">
          <option value="default">Par défaut</option>
          <option value="rating-desc">Mieux notés</option>
          <option value="duration-asc">Plus courts</option>
          <option value="duration-desc">Plus longs</option>
        </select>
      </div>
    </div>

    <div class="animes-grid" id="favoritesGrid"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
