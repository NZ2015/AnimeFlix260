<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IrAnimeX</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .anime-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      max-width: 1200px;
      margin: 0 auto 25px;
      padding: 0 20px;
    }

    .duration-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .duration-btn {
      background: rgba(255, 0, 110, 0.15);
      border: 2px solid rgba(255, 0, 110, 0.5);
      color: #ff006e;
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .duration-btn.active,
    .duration-btn:hover {
      background: linear-gradient(135deg, #ff006e, #8338ec);
      color: #fff;
      border-color: transparent;
      transform: translateY(-1px);
    }

    .sort-box {
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      font-weight: 600;
    }

    .sort-box select {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 10px;
      padding: 10px 12px;
    }

    .anime-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    .anime-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .anime-card:hover {
      transform: translateY(-4px);
    }

    .anime-card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
    }

    .anime-info {
      padding: 16px;
    }

    .anime-info h3 {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }

    .anime-duration,
    .rating,
    .genre {
      margin: 4px 0;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.8);
    }

    .card-buttons {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .play-btn,
    .favorite-btn {
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
    }

    .play-btn {
      flex: 1;
      background: linear-gradient(135deg, #ff006e, #8338ec);
      color: white;
    }

    .favorite-btn {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .empty-message {
      max-width: 1200px;
      color: rgba(255,255,255,0.75);
      text-align: center;
      margin: 0 auto;
      padding: 30px 20px 50px;
    }
  </style>
</head>
<body data-page="home">
  <header class="header">
    <div class="header-container">
      <div class="logo">
        <img src="images/logo.png" alt="IrAnimeX Logo.png">
        <span>IrAnimeX</span>
      </div>

      <nav class="nav">
        <a href="index.html" class="nav-link active">Accueil</a>
        <a href="categories.html" class="nav-link">Catalogue</a>
        <a href="favorites.html" class="nav-link">Favoris</a>
      </nav>

      <div class="auth-buttons">
        <button class="btn btn-secondary">Connexion</button>
        <button class="btn btn-primary">S'inscrire</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>Bienvenue sur IrAnimeX</h1>
      <p>Découvrez des milliers d'animes en streaming HD.</p>

      <div class="search-bar">
        <div class="search-container">
          <i class="fas fa-search"></i>
          <input id="searchInput" type="text" placeholder="Rechercher un anime...">
          <button class="search-btn">Rechercher</button>
        </div>
      </div>
    </div>
  </section>

  <main>
    <div class="anime-toolbar">
      <div class="duration-filters" id="durationFilters"></div>
      <div class="sort-box">
        <label for="sortSelect">Trier :</label>
        <select id="sortSelect">
          <option value="default">Par défaut</option>
          <option value="rating-desc">Mieux notés</option>
          <option value="duration-asc">Plus courts</option>
          <option value="duration-desc">Plus longs</option>
        </select>
      </div>
    </div>

    <h2 class="section-title">Nos Animes</h2>
    <div id="animeList" class="anime-grid"></div>

    <div class="pagination">
      <button onclick="prevPage()">⏮</button>
      <button onclick="nextPage()">⏭</button>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-section">
        <h3>IrAnimeX</h3>
        <p>Votre plateforme anime.</p>
      </div>
      <div class="footer-section">
        <h3>Liens utiles</h3>
        <p><a href="index.html">Accueil</a></p>
        <p><a href="categories.html">Catalogue</a></p>
        <p><a href="favorites.html">Favoris</a></p>
      </div>
      <div class="footer-section">
        <h3>Contact</h3>
        <p>Email : contact@iranimex.com</p>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
