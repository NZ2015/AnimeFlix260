<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catégories - AnimeFlix260</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
        }

        header {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: 2px solid #ff006e;
            background: transparent;
            color: #ff006e;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #ff006e;
            color: #fff;
            transform: translateY(-2px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            align-items: center;
        }

        .duration-filters,
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
        }

        .duration-btn,
        .category-btn {
            padding: 18px 16px;
            background: rgba(255, 0, 110, 0.2);
            border: 2px solid rgba(255, 0, 110, 0.4);
            color: #ff006e;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .duration-btn:hover,
        .duration-btn.active,
        .category-btn:hover,
        .category-btn.active {
            background: #ff006e;
            color: #fff;
            border-color: #ff006e;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 0, 110, 0.3);
        }

        .sort-box {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-weight: 600;
        }

        .sort-box select {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 8px;
            padding: 10px 12px;
        }

        .animes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .anime-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .anime-card:hover {
            transform: translateY(-10px);
            border-color: #ff006e;
            box-shadow: 0 15px 40px rgba(255, 0, 110, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .anime-poster {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #8338ec, #3a86ff);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .anime-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .anime-info {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .anime-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .anime-rating {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .stars {
            color: #ffd700;
            margin-right: 10px;
            font-size: 16px;
        }

        .rating-value {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .anime-genres {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .genre-tag {
            background: rgba(255, 0, 110, 0.2);
            color: #ff006e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid rgba(255, 0, 110, 0.4);
        }

        .anime-description {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 15px;
            flex: 1;
        }

        .anime-duration {
            font-size: 13px;
            color: #fff;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .view-btn {
            background: linear-gradient(135deg, #ff006e, #8338ec);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            width: 100%;
        }

        .view-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 0, 110, 0.4);
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .toolbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .categories-grid,
            .duration-filters {
                grid-template-columns: repeat(2, 1fr);
            }

            .animes-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }

            .page-title {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo" onclick="window.location.href='index.html'">🎬 AnimeFlix260</div>
            <div class="nav-buttons">
                <a href="index.html" class="btn">Accueil</a>
                <a href="categories.html" class="btn">Catégories</a>
                <a href="favorites.html" class="btn">❤️ Favoris</a>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">📺 Catégories d'Animes</h1>

        <div class="toolbar">
            <div class="duration-filters" id="durationFilters">
                <button class="duration-btn active" data-duration="Tous">Tous</button>
                <button class="duration-btn" data-duration="1h">1h</button>
                <button class="duration-btn" data-duration="2h">2h</button>
                <button class="duration-btn" data-duration="3h">3h</button>
            </div>

            <div class="sort-box">
                <label for="sortSelect">Trier :</label>
                <select id="sortSelect">
                    <option value="default">Par défaut</option>
                    <option value="duration-asc">Plus courts</option>
                    <option value="duration-desc">Plus longs</option>
                    <option value="rating-desc">Mieux notés</option>
                </select>
            </div>
        </div>

        <div class="categories-grid" id="categoriesContainer"></div>
        <div class="animes-grid" id="animesGrid"></div>
        <div class="no-results" id="noResults" style="display: none;">Aucun anime trouvé dans cette catégorie.</div>
    </div>

    <script>
        let allAnimes = [];
        let allGenres = [];
        let currentDurationFilter = 'Tous';
        let currentSortMode = 'default';
        let activeGenre = 'Tous';

        function toMinutes(duration) {
            if (!duration) return 0;
            if (typeof duration === 'number') return duration;

            const normalized = String(duration).trim();

            if (normalized.toLowerCase().includes('h')) {
                const hours = parseFloat(normalized.split('h')[0]) || 0;
                const minutesPart = normalized.split('h')[1] || '0';
                const minutes = parseInt((minutesPart || '0').replace(/min|m/gi, '').trim(), 10) || 0;
                return (hours * 60) + minutes;
            }

            const parts = normalized.split(':').map(part => parseInt(part, 10));
            if (parts.length === 2) {
                return (parts[0] * 60) + parts[1];
            }

            return 0;
        }

        function formatDurationLabel(minutes) {
            if (!minutes) return 'Durée inconnue';
            const hours = Math.floor(minutes / 60);
            const mins = Math.round(minutes % 60);
            if (hours === 0) return `${mins} min`;
            if (mins === 0) return `${hours}h`;
            return `${hours}h ${mins}min`;
        }

        function getAnimeAvgDuration(anime) {
            const values = (anime.seasons || []).flatMap(season => (season.episodes || []).map(episode => toMinutes(episode.duration)));
            if (!values.length) return 0;
            return values.reduce((sum, value) => sum + value, 0) / values.length;
        }

        function matchesDurationFilter(anime, filter) {
            if (filter === 'Tous') return true;

            const target = { '1h': 60, '2h': 120, '3h': 180 };
            const avgMinutes = getAnimeAvgDuration(anime);
            const tolerance = 15;
            return Math.abs(avgMinutes - target[filter]) <= tolerance;
        }

        function getSortedAnimes(list) {
            const sorted = [...list];
            switch (currentSortMode) {
                case 'duration-asc':
                    return sorted.sort((a, b) => getAnimeAvgDuration(a) - getAnimeAvgDuration(b));
                case 'duration-desc':
                    return sorted.sort((a, b) => getAnimeAvgDuration(b) - getAnimeAvgDuration(a));
                case 'rating-desc':
                    return sorted.sort((a, b) => (b.rating || 0) - (a.rating || 0));
                default:
                    return sorted;
            }
        }

        function applyCombinedFilters() {
            let filtered = allAnimes.filter(anime => {
                const genreMatch = activeGenre === 'Tous' || anime.genres.includes(activeGenre);
                const durationMatch = matchesDurationFilter(anime, currentDurationFilter);
                return genreMatch && durationMatch;
            });

            filtered = getSortedAnimes(filtered);
            displayAnimes(filtered);
        }

        fetch('anime.json')
            .then(response => response.json())
            .then(data => {
                allAnimes = data.animes;
                const genreSet = new Set();
                allAnimes.forEach(anime => {
                    anime.genres.forEach(genre => genreSet.add(genre));
                });
                allGenres = ['Tous', ...Array.from(genreSet).sort()];
                displayCategories();
                applyCombinedFilters();
            });

        function getStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 >= 0.5;
            let stars = '★'.repeat(fullStars);
            if (hasHalfStar) stars += '½';
            return stars;
        }

        function displayCategories() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = allGenres.map(genre => 
                `<button class="category-btn ${genre === 'Tous' ? 'active' : ''}" onclick="filterByGenre(event, '${genre}')">${genre}</button>`
            ).join('');
        }

        function filterByGenre(e, genre) {
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            if (e && e.target) e.target.classList.add('active');
            activeGenre = genre;
            applyCombinedFilters();
        }

        function filterByDuration(duration) {
            currentDurationFilter = duration;
            document.querySelectorAll('.duration-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.duration === duration);
            });
            applyCombinedFilters();
        }

        function displayAnimes(animes) {
            const grid = document.getElementById('animesGrid');
            const noResults = document.getElementById('noResults');

            if (animes.length === 0) {
                grid.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';
            grid.innerHTML = animes.map(anime => {
                const avgMinutes = getAnimeAvgDuration(anime);
                return `
                    <div class="anime-card" onclick="window.location.href='details.html?id=${anime.id}'">
                        <div class="anime-poster">
                            ${anime.poster ? `<img src="${anime.poster}" alt="${anime.title}">` : `<div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #8338ec, #3a86ff);">${anime.title}</div>`}
                        </div>
                        <div class="anime-info">
                            <div class="anime-title">${anime.title}</div>
                            <div class="anime-rating">
                                <span class="stars">${getStars(anime.rating)}</span>
                                <span class="rating-value">${anime.rating}/5</span>
                            </div>
                            <div class="anime-duration">⏱️ ${formatDurationLabel(avgMinutes)}</div>
                            <div class="anime-genres">
                                ${anime.genres.map(genre => `<span class="genre-tag">${genre}</span>`).join('')}
                            </div>
                            <div class="anime-description">${anime.description}</div>
                            <button class="view-btn" onclick="event.stopPropagation(); window.location.href='details.html?id=${anime.id}'">
                                Voir Détails
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.querySelectorAll('.duration-btn').forEach(btn => {
            btn.addEventListener('click', () => filterByDuration(btn.dataset.duration));
        });

        document.getElementById('sortSelect')?.addEventListener('change', function () {
            currentSortMode = this.value;
            applyCombinedFilters();
        });
    </script>
</body>
</html>
