<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Favoris - AnimeFlix260</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
        }

        header {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: 2px solid #ff006e;
            background: transparent;
            color: #ff006e;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #ff006e;
            color: #fff;
            transform: translateY(-2px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .favorites-count {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
        }

        .filter-bar {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            align-items: center;
        }

        .duration-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .duration-btn {
            background: rgba(255, 0, 110, 0.15);
            border: 2px solid rgba(255, 0, 110, 0.5);
            color: #ff006e;
            border-radius: 999px;
            padding: 10px 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .duration-btn.active,
        .duration-btn:hover {
            background: linear-gradient(135deg, #ff006e, #8338ec);
            color: #fff;
            border-color: transparent;
            transform: translateY(-1px);
        }

        .sort-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sort-box select {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
        }

        .animes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .anime-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .anime-card:hover {
            transform: translateY(-10px);
            border-color: #ff006e;
            box-shadow: 0 15px 40px rgba(255, 0, 110, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .anime-poster {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #8338ec, #3a86ff);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .anime-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .anime-info {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .anime-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .anime-rating {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .stars {
            color: #ffd700;
            margin-right: 10px;
            font-size: 16px;
        }

        .rating-value {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .anime-genres {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .genre-tag {
            background: rgba(255, 0, 110, 0.2);
            color: #ff006e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid rgba(255, 0, 110, 0.4);
        }

        .anime-description {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 15px;
            flex: 1;
        }

        .anime-duration {
            display: inline-block;
            margin-bottom: 12px;
            background: rgba(131, 56, 236, 0.25);
            border: 1px solid rgba(131, 56, 236, 0.7);
            color: #d9c8ff;
            border-radius: 999px;
            padding: 5px 10px;
            font-weight: 700;
            font-size: 12px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .view-btn {
            flex: 1;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .favorite-remove-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 8px;
            padding: 12px 14px;
            cursor: pointer;
        }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .filter-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo" onclick="window.location.href='index.html'">🎬 AnimeFlix260</div>
            <div class="nav-buttons">
                <a href="index.html" class="btn">Accueil</a>
                <a href="categories.html" class="btn">Catégories</a>
                <a href="favorites.html" class="btn">❤️ Favoris</a>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">💙 Mes Favoris</h1>
        <div class="favorites-count" id="favoritesCount">0 anime(s) en favori</div>

        <div class="filter-bar">
            <div class="duration-filters">
                <button class="duration-btn active" data-duration="Tous">Tous</button>
                <button class="duration-btn" data-duration="1h">1h</button>
                <button class="duration-btn" data-duration="2h">2h</button>
                <button class="duration-btn" data-duration="3h">3h</button>
            </div>

            <div class="sort-box">
                <label for="sortSelect">Trier :</label>
                <select id="sortSelect">
                    <option value="default">Par défaut</option>
                    <option value="duration-asc">Plus courts</option>
                    <option value="duration-desc">Plus longs</option>
                    <option value="rating-desc">Mieux notés</option>
                </select>
            </div>
        </div>

        <div class="animes-grid" id="favoritesGrid"></div>
    </div>

    <script>
        const storageKey = 'favoris';
        let allAnimes = [];
        let currentDurationFilter = 'Tous';
        let currentSortMode = 'default';

        function toMinutes(duration) {
            if (!duration) return 0;
            if (typeof duration === 'number') return duration;

            const normalized = String(duration).trim();
            if (normalized.toLowerCase().includes('h')) {
                const hours = parseFloat(normalized.split('h')[0]) || 0;
                const minutesPart = normalized.split('h')[1] || '0';
                const minutes = parseInt((minutesPart || '0').replace(/min|m/gi, '').trim(), 10) || 0;
                return (hours * 60) + minutes;
            }

            const parts = normalized.split(':').map(part => parseInt(part, 10));
            if (parts.length === 2) {
                return (parts[0] * 60) + parts[1];
            }

            return 0;
        }

        function formatDurationLabel(minutes) {
            if (!minutes) return 'Durée inconnue';
            const hours = Math.floor(minutes / 60);
            const mins = Math.round(minutes % 60);
            if (hours === 0) return `${mins} min`;
            if (mins === 0) return `${hours}h`;
            return `${hours}h ${mins}min`;
        }

        function getAnimeAvgDuration(anime) {
            const values = (anime.seasons || []).flatMap(season => (season.episodes || []).map(episode => toMinutes(episode.duration)));
            if (!values.length) return 0;
            return values.reduce((sum, value) => sum + value, 0) / values.length;
        }

        function matchesDurationFilter(anime, filter) {
            if (filter === 'Tous') return true;

            const target = { '1h': 60, '2h': 120, '3h': 180 };
            const avgMinutes = getAnimeAvgDuration(anime);
            const tolerance = 15;
            return Math.abs(avgMinutes - target[filter]) <= tolerance;
        }

        function getSortedAnimes(list) {
            const sorted = [...list];
            switch (currentSortMode) {
                case 'duration-asc':
                    return sorted.sort((a, b) => getAnimeAvgDuration(a) - getAnimeAvgDuration(b));
                case 'duration-desc':
                    return sorted.sort((a, b) => getAnimeAvgDuration(b) - getAnimeAvgDuration(a));
                case 'rating-desc':
                    return sorted.sort((a, b) => (b.rating || 0) - (a.rating || 0));
                default:
                    return sorted;
            }
        }

        function getFavorites() {
            try {
                return JSON.parse(localStorage.getItem(storageKey)) || [];
            } catch {
                return [];
            }
        }

        function renderFavorites() {
            const favorites = getFavorites();
            const container = document.getElementById('favoritesGrid');
            const countNode = document.getElementById('favoritesCount');

            const favoriteAnimes = allAnimes.filter(anime => favorites.includes(anime.id));
            const filtered = getSortedAnimes(
                favoriteAnimes.filter(anime => matchesDurationFilter(anime, currentDurationFilter))
            );

            if (countNode) {
                countNode.textContent = `${filtered.length} anime(s) en favori`;
            }

            if (!container) return;

            if (!filtered.length) {
                container.innerHTML = '<div class="empty-state">Aucun anime favori ne correspond au filtre actuel.</div>';
                return;
            }

            container.innerHTML = filtered.map(anime => `
                <div class="anime-card">
                    <div class="anime-poster">
                        <img src="${anime.poster}" alt="${anime.title}">
                    </div>
                    <div class="anime-info">
                        <div class="anime-title">${anime.title}</div>
                        <span class="anime-duration">⏱️ ${formatDurationLabel(getAnimeAvgDuration(anime))}</span>
                        <div class="anime-rating">
                            <span class="stars">★</span>
                            <span class="rating-value">${anime.rating}/5</span>
                        </div>
                        <div class="anime-genres">
                            ${(anime.genres || []).map(genre => `<span class="genre-tag">${genre}</span>`).join('')}
                        </div>
                        <div class="anime-description">${anime.description}</div>
                        <div class="action-buttons">
                            <button class="view-btn" onclick="window.location.href='details.html?id=${anime.id}'">Voir Détails</button>
                            <button class="favorite-remove-btn" onclick="removeFavorite(${anime.id})">💔</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function removeFavorite(id) {
            const favorites = getFavorites().filter(item => item !== id);
            localStorage.setItem(storageKey, JSON.stringify(favorites));
            renderFavorites();
        }

        fetch('anime.json')
            .then(response => response.json())
            .then(data => {
                allAnimes = data.animes;
                renderFavorites();
            });

        document.querySelectorAll('.duration-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                currentDurationFilter = this.dataset.duration;
                document.querySelectorAll('.duration-btn').forEach(b => b.classList.toggle('active', b === this));
                renderFavorites();
            });
        });

        document.getElementById('sortSelect')?.addEventListener('change', function () {
            currentSortMode = this.value;
            renderFavorites();
        });
    </script>
</body>
</html>
