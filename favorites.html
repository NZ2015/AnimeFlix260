<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Favoris - AnimeFlix260</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
        }

        header {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: 2px solid #ff006e;
            background: transparent;
            color: #ff006e;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #ff006e;
            color: #fff;
            transform: translateY(-2px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .favorites-count {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
        }

        .animes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .anime-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .anime-card:hover {
            transform: translateY(-10px);
            border-color: #ff006e;
            box-shadow: 0 15px 40px rgba(255, 0, 110, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .anime-poster {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #8338ec, #3a86ff);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .anime-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .anime-info {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .anime-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .anime-rating {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .stars {
            color: #ffd700;
            margin-right: 10px;
            font-size: 16px;
        }

        .rating-value {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .anime-genres {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .genre-tag {
            background: rgba(255, 0, 110, 0.2);
            color: #ff006e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid rgba(255, 0, 110, 0.4);
        }

        .anime-description {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 15px;
            flex: 1;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .view-btn {
            flex: 1;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .view-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 0, 110, 0.4);
        }

        .remove-btn {
            background: rgba(255, 0, 110, 0.2);
            color: #ff006e;
            border: 2px solid rgba(255, 0, 110, 0.4);
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .remove-btn:hover {
            background: #ff006e;
            color: #fff;
            border-color: #ff006e;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .empty-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .empty-message {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
        }

        .explore-btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .explore-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 0, 110, 0.4);
        }

        @media (max-width: 768px) {
            .animes-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }

            .page-title {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo" onclick="window.location.href='index.html'">🎬 AnimeFlix260</div>
            <div class="nav-buttons">
                <a href="index.html" class="btn">Accueil</a>
                <a href="categories.html" class="btn">Catégories</a>
                <a href="favorites.html" class="btn">❤️ Favoris</a>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">❤️ Mes Animes Favoris</h1>
        <div class="favorites-count" id="favoritesCount"></div>
        <div class="animes-grid" id="favoritesGrid"></div>
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">📭</div>
            <div class="empty-title">Aucun Favori</div>
            <div class="empty-message">Vous n'avez pas encore ajouté d'animes à vos favoris.</div>
            <a href="categories.html" class="explore-btn">Découvrir les Animes</a>
        </div>
    </div>

    <script>
        let allAnimes = [];

        fetch('anime.json')
            .then(response => response.json())
            .then(data => {
                allAnimes = data.animes;
                displayFavorites();
            });

        function getStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 >= 0.5;
            let stars = '★'.repeat(fullStars);
            if (hasHalfStar) stars += '½';
            return stars;
        }

        function getFavorites() {
            const favorites = JSON.parse(localStorage.getItem('animeFlix_favorites') || '{}');
            return Object.keys(favorites).filter(id => favorites[id]).map(id => parseInt(id));
        }

        function removeFavorite(animeId) {
            let favorites = JSON.parse(localStorage.getItem('animeFlix_favorites') || '{}');
            delete favorites[animeId];
            localStorage.setItem('animeFlix_favorites', JSON.stringify(favorites));
            displayFavorites();
        }

        function displayFavorites() {
            const favoriteIds = getFavorites();
            const favoriteAnimes = allAnimes.filter(anime => favoriteIds.includes(anime.id));

            const grid = document.getElementById('favoritesGrid');
            const emptyState = document.getElementById('emptyState');
            const count = document.getElementById('favoritesCount');

            if (favoriteAnimes.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'block';
                count.textContent = 'Aucun anime favori';
                return;
            }

            grid.style.display = 'grid';
            emptyState.style.display = 'none';
            count.textContent = `${favoriteAnimes.length} anime${favoriteAnimes.length > 1 ? 's' : ''} en favori${favoriteAnimes.length > 1 ? 's' : ''}`;

            grid.innerHTML = favoriteAnimes.map(anime => `
                <div class="anime-card">
                    <div class="anime-poster">
                        ${anime.poster ? `<img src="${anime.poster}" alt="${anime.title}">` : `<div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #8338ec, #3a86ff);">${anime.title}</div>`}
                    </div>
                    <div class="anime-info">
                        <div class="anime-title">${anime.title}</div>
                        <div class="anime-rating">
                            <span class="stars">${getStars(anime.rating)}</span>
                            <span class="rating-value">${anime.rating}/5</span>
                        </div>
                        <div class="anime-genres">
                            ${anime.genres.map(genre => `<span class="genre-tag">${genre}</span>`).join('')}
                        </div>
                        <div class="anime-description">${anime.description}</div>
                        <div class="action-buttons">
                            <a href="details.html?id=${anime.id}" class="view-btn">Voir Détails</a>
                            <button class="remove-btn" onclick="removeFavorite(${anime.id})">Retirer</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
